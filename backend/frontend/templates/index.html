<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FaceHub - Demo Central</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">FaceHub</a>
    </div>
  </nav>

  <main class="container my-4">
    <div class="row g-4">
      <section class="col-lg-4">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title">Registrar Sitio</h5>
            <form id="site-form">
              <div class="mb-2">
                <label class="form-label">Nombre</label>
                <input class="form-control" name="name" required />
              </div>
              <div class="mb-2">
                <label class="form-label">Ubicación</label>
                <input class="form-control" name="location" />
              </div>
              <button class="btn btn-primary w-100" type="submit">Guardar sitio</button>
            </form>
          </div>
        </div>
      </section>

      <section class="col-lg-4">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title">Añadir Cámara</h5>
            <form id="camera-form">
              <div class="mb-2">
                <label class="form-label">Nombre</label>
                <input class="form-control" name="name" required />
              </div>
              <div class="mb-2">
                <label class="form-label">RTSP / ONVIF</label>
                <input class="form-control" name="rtsp_url" placeholder="rtsp://" required />
              </div>
              <div class="mb-2">
                <label class="form-label">Sitio</label>
                <select class="form-select" name="site_id" id="camera-site" required></select>
              </div>
              <button class="btn btn-primary w-100" type="submit">Guardar cámara</button>
            </form>
          </div>
        </div>
      </section>

      <section class="col-lg-4">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title">Registrar Persona</h5>
            <form id="person-form">
              <div class="mb-2">
                <label class="form-label">Nombre completo</label>
                <input class="form-control" name="full_name" required />
              </div>
              <div class="mb-2">
                <label class="form-label">Rol</label>
                <input class="form-control" name="role" placeholder="Cliente, Lista Roja, etc." />
              </div>
              <div class="mb-2">
                <label class="form-label">Embedding (texto)</label>
                <textarea class="form-control" name="embedding" placeholder="[0.1, -0.2, ...]"></textarea>
              </div>
              <button class="btn btn-primary w-100" type="submit">Guardar persona</button>
            </form>
          </div>
        </div>
      </section>
    </div>

    <div class="row g-4 mt-3">
      <section class="col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h5 class="card-title">Alertas recientes</h5>
              <button class="btn btn-outline-secondary btn-sm" id="refresh-alerts">Actualizar</button>
            </div>
            <div id="alerts" class="list-group small"></div>
          </div>
        </div>
      </section>

      <section class="col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h5 class="card-title">Inventario</h5>
              <button class="btn btn-outline-secondary btn-sm" id="refresh-inventory">Actualizar</button>
            </div>
            <div class="row">
              <div class="col-6">
                <h6>Sitios</h6>
                <ul id="site-list" class="list-group small"></ul>
              </div>
              <div class="col-6">
                <h6>Cámaras</h6>
                <ul id="camera-list" class="list-group small"></ul>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js"></script>
  <script src="/static/main.js"></script>
</body>
</html>
